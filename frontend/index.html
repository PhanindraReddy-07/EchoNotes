<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoNotes - Speech to Notes</title>

    <!-- React & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"DM Sans"', 'sans-serif'],
                        body: ['"DM Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef6ff', 100: '#d9eaff', 200: '#bcdaff',
                            300: '#8ec3ff', 400: '#59a1ff', 500: '#3478ff',
                            600: '#1b55f5', 700: '#1440e1', 800: '#1735b6',
                            900: '#19318f', DEFAULT: '#3478ff',
                        },
                        surface: {
                            0: '#ffffff', 50: '#f8fafc', 100: '#f1f5f9',
                            200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8',
                            500: '#64748b', 600: '#475569', 700: '#334155',
                            800: '#1e293b', 900: '#0f172a',
                        },
                    },
                },
            },
        };

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'DM Sans', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Animations */
        @keyframes fadeUp   { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
        @keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
        @keyframes spin     { to { transform:rotate(360deg); } }
        @keyframes bar      { 0%,100%{ height:10px; } 50%{ height:28px; } }

        .anim-fade-up { animation: fadeUp .45s ease-out both; }
        .anim-fade-in { animation: fadeIn .3s ease-out both; }
        .anim-pulse   { animation: pulse-dot 1.4s ease-in-out infinite; }
        .anim-spin    { animation: spin .8s linear infinite; }

        .wave-bars { display:flex; align-items:end; gap:3px; height:30px; }
        .wave-bars span { width:4px; border-radius:2px; background:currentColor; animation:bar 1s ease-in-out infinite; }
        .wave-bars span:nth-child(1){animation-delay:0s}
        .wave-bars span:nth-child(2){animation-delay:.1s}
        .wave-bars span:nth-child(3){animation-delay:.2s}
        .wave-bars span:nth-child(4){animation-delay:.3s}
        .wave-bars span:nth-child(5){animation-delay:.4s}

        /* Simple bar chart via CSS */
        .chart-bar { transition: height .5s ease, background .2s; border-radius: 4px 4px 0 0; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-surface-50 min-h-screen text-surface-800">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const API = 'http://localhost:8000';

/* ──────────────────── SVG ICONS ──────────────────── */

    Mic:      (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>,
    Upload:   (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
    Download: (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
    FileText: (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>,
    Clock:    (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
    Trash:    (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>,
    Search:   (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>,
    BarChart: (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>,
    Globe:    (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
    Check:    (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
    X:        (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>,
    Loader:   (p={}) => <svg {...p} className={"anim-spin "+(p.className||"")} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
    Sparkle:  (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
    ChevronL: (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
    ChevronR: (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
    Eye:      (p={}) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
};

/* ──────────────────── HELPERS ──────────────────── */
const fmtDuration = (s) => { if(!s) return '0s'; const m=Math.floor(s/60); const sec=Math.round(s%60); return m?`${m}m ${sec}s`:`${sec}s`; };
const fmtDate = (iso) => { if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); };
const langLabel = {en:'English',hi:'Hindi',te:'Telugu',auto:'Auto'};
const statusColors = { completed:'bg-emerald-100 text-emerald-700', failed:'bg-red-100 text-red-700', processing:'bg-amber-100 text-amber-700', pending:'bg-surface-200 text-surface-600' };

const Badge = ({children, color}) => (
    <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${color||'bg-surface-200 text-surface-600'}`}>{children}</span>
);

/* ──────────────────── AUDIO RECORDER ──────────────────── */
const useAudioRecorder = () => {
    const [isRecording, setIsRecording] = useState(false);
    const [audioBlob, setAudioBlob] = useState(null);
    const [duration, setDuration] = useState(0);
    const [error, setError] = useState(null);
    const mediaRec = useRef(null);
    const chunks = useRef([]);
    const timer = useRef(null);
    const startTime = useRef(0);

    const start = useCallback(async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1}});
            const mr = new MediaRecorder(stream, {mimeType:'audio/webm'});
            chunks.current = [];
            mr.ondataavailable = e => chunks.current.push(e.data);
            mr.onstop = () => {
                const blob = new Blob(chunks.current, {type:'audio/webm'});
                setAudioBlob(blob);
                stream.getTracks().forEach(t=>t.stop());
            };
            mr.start(250);
            mediaRec.current = mr;
            startTime.current = Date.now();
            timer.current = setInterval(()=> setDuration(Math.round((Date.now()-startTime.current)/1000)),500);
            setIsRecording(true); setError(null);
        } catch(e) { setError(e.message); }
    },[]);

    const stop = useCallback(()=>{
        if(mediaRec.current && mediaRec.current.state!=='inactive') mediaRec.current.stop();
        clearInterval(timer.current);
        setIsRecording(false);
    },[]);

    const reset = useCallback(()=>{ setAudioBlob(null); setDuration(0); setError(null); },[]);
    return { isRecording, audioBlob, duration, error, start, stop, reset };
};

/* ──────────────────── STAT CARD ──────────────────── */
const StatCard = ({icon, label, value, sub, accent='text-brand-600'}) => (
    <div className="bg-white rounded-xl p-5 border border-surface-200 shadow-sm anim-fade-up">
        <div className="flex items-center gap-3 mb-3">
            <div className={`p-2 rounded-lg bg-brand-50 ${accent}`}>{icon}</div>
            <span className="text-sm text-surface-500 font-medium">{label}</span>
        </div>
        <div className="text-2xl font-bold tracking-tight">{value}</div>
        {sub && <div className="text-xs text-surface-400 mt-1">{sub}</div>}
    </div>
);

/* ──────────────────── MINI BAR CHART ──────────────────── */
const ActivityChart = ({data}) => {
    const max = Math.max(...data.map(d=>d.count),1);
    return (
        <div className="bg-white rounded-xl border border-surface-200 shadow-sm p-5 anim-fade-up" style={{animationDelay:'.15s'}}>
            <h3 className="text-sm font-semibold text-surface-600 mb-4">Last 7 Days Activity</h3>
            <div className="flex items-end justify-between gap-2" style={{height:120}}>
                {data.length===0 && <p className="text-xs text-surface-400 m-auto">No activity yet</p>}
                {data.map((d,i)=>(
                    <div key={i} className="flex-1 flex flex-col items-center gap-1">
                        <div className="chart-bar w-full bg-brand-400 hover:bg-brand-500 cursor-default"
                             style={{height:`${Math.max((d.count/max)*100,4)}%`}}
                             title={`${d.count} session(s)`}/>
                        <span className="text-[10px] text-surface-400 mono">{d.date?.slice(5)||''}</span>
                    </div>
                ))}
            </div>
        </div>
    );
};

/* ══════════════════ DASHBOARD TAB ══════════════════ */
const DashboardTab = () => {
    const [stats, setStats] = useState(null);
    const [history, setHistory] = useState({sessions:[],total:0});
    const [page, setPage] = useState(0);
    const [search, setSearch] = useState('');
    const [filterStatus, setFilterStatus] = useState('');
    const [filterLang, setFilterLang] = useState('');
    const [detail, setDetail] = useState(null);
    const limit = 10;

    const fetchStats = () => fetch(`${API}/api/dashboard`).then(r=>r.json()).then(setStats).catch(()=>{});
    const fetchHistory = () => {
        const params = new URLSearchParams({limit,offset:page*limit,sort_order:'desc'});
        if(filterStatus) params.set('status',filterStatus);
        if(filterLang) params.set('language',filterLang);
        if(search) params.set('search',search);
        fetch(`${API}/api/history?${params}`).then(r=>r.json()).then(setHistory).catch(()=>{});
    };

    useEffect(()=>{ fetchStats(); },[]);
    useEffect(()=>{ fetchHistory(); },[page,filterStatus,filterLang,search]);

    const totalPages = Math.ceil((history.total||0)/limit);

    const deleteSession = async (id) => {
        if(!confirm('Delete this session?')) return;
        await fetch(`${API}/api/history/${id}`,{method:'DELETE'});
        fetchHistory(); fetchStats();
        if(detail?.id===id) setDetail(null);
    };

    return (
        <div className="space-y-6 anim-fade-in">
            {/* Stats Row */}
            {stats && (
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <StatCard icon={<Icon.FileText/>} label="Total Sessions" value={stats.total_sessions}
                              sub={`${stats.completed} completed · ${stats.failed} failed`}/>
                    <StatCard icon={<Icon.Clock/>}    label="Audio Processed" value={`${stats.total_audio_minutes} min`}
                              sub={`${stats.total_words.toLocaleString()} words transcribed`}/>
                    <StatCard icon={<Icon.BarChart/>} label="Avg Confidence" value={`${(stats.avg_confidence*100).toFixed(1)}%`}
                              sub={`Avg time: ${stats.avg_processing_time}s`}/>
                    <StatCard icon={<Icon.Globe/>}    label="Languages" value={Object.keys(stats.by_language).length||0}
                              sub={Object.entries(stats.by_language).map(([l,v])=>`${langLabel[l]||l}: ${v.count}`).join(' · ')||'No data'}/>
                </div>
            )}

            {/* Chart + Format breakdown */}
            {/* <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <div className="lg:col-span-2">
                    <ActivityChart data={stats?.daily_activity||[]}/>
                </div>
                <div className="bg-white rounded-xl border border-surface-200 shadow-sm p-5 anim-fade-up" style={{animationDelay:'.2s'}}>
                    <h3 className="text-sm font-semibold text-surface-600 mb-4">Output Formats</h3>
                    {stats && Object.keys(stats.by_format).length > 0 ? (
                        <div className="space-y-3">
                            {Object.entries(stats.by_format).map(([fmt,cnt])=>(
                                <div key={fmt} className="flex items-center justify-between">
                                    <span className="text-sm font-medium uppercase mono">{fmt}</span>
                                    <Badge color="bg-brand-100 text-brand-700">{cnt}</Badge>
                                </div>
                            ))}
                        </div>
                    ) : <p className="text-xs text-surface-400">No documents generated yet</p>}
                </div>
            </div> */}

            {/* History Table */}
            <div className="bg-white rounded-xl border border-surface-200 shadow-sm overflow-hidden anim-fade-up" style={{animationDelay:'.25s'}}>
                {/* Toolbar */}
                <div className="p-4 border-b border-surface-100 flex flex-wrap items-center gap-3">
                    <h3 className="text-sm font-semibold text-surface-700 mr-auto">Processing History</h3>
                    <div className="relative">
                        <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-surface-400"><Icon.Search/></span>
                        <input value={search} onChange={e=>{setSearch(e.target.value);setPage(0);}}
                               placeholder="Search title or text…"
                               className="pl-9 pr-3 py-1.5 text-sm rounded-lg border border-surface-200 focus:border-brand-400 focus:ring-1 focus:ring-brand-200 outline-none w-48"/>
                    </div>
                    <select value={filterStatus} onChange={e=>{setFilterStatus(e.target.value);setPage(0);}}
                            className="text-sm rounded-lg border border-surface-200 px-2 py-1.5 outline-none">
                        <option value="">All Status</option>
                        <option value="completed">Completed</option>
                        <option value="failed">Failed</option>
                        <option value="processing">Processing</option>
                    </select>
                    <select value={filterLang} onChange={e=>{setFilterLang(e.target.value);setPage(0);}}
                            className="text-sm rounded-lg border border-surface-200 px-2 py-1.5 outline-none">
                        <option value="">All Languages</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                    </select>
                </div>

                {/* Table */}
                <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                        <thead className="bg-surface-50 text-surface-500 text-xs uppercase tracking-wider">
                            <tr>
                                <th className="px-4 py-3 text-left">Title</th>
                                <th className="px-4 py-3 text-left">Status</th>
                                <th className="px-4 py-3 text-left">Language</th>
                                <th className="px-4 py-3 text-right">Words</th>
                                <th className="px-4 py-3 text-right">Confidence</th>
                                <th className="px-4 py-3 text-right">Duration</th>
                                <th className="px-4 py-3 text-left">Date</th>
                                <th className="px-4 py-3 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-surface-100">
                            {history.sessions.length===0 && (
                                <tr><td colSpan="8" className="px-4 py-12 text-center text-surface-400">
                                    No sessions found. Process some audio to see history here.
                                </td></tr>
                            )}
                            {history.sessions.map(s=>(
                                <tr key={s.id} className="hover:bg-surface-50 transition-colors">
                                    <td className="px-4 py-3 font-medium max-w-[200px] truncate">{s.title}</td>
                                    <td className="px-4 py-3"><Badge color={statusColors[s.status]}>{s.status}</Badge></td>
                                    <td className="px-4 py-3">{langLabel[s.language]||s.language}</td>
                                    <td className="px-4 py-3 text-right mono">{s.word_count||'—'}</td>
                                    <td className="px-4 py-3 text-right mono">{s.confidence? (s.confidence*100).toFixed(1)+'%':'—'}</td>
                                    <td className="px-4 py-3 text-right mono">{fmtDuration(s.audio_duration)}</td>
                                    <td className="px-4 py-3 text-surface-500 whitespace-nowrap">{fmtDate(s.created_at)}</td>
                                    <td className="px-4 py-3 text-center">
                                        <div className="flex items-center justify-center gap-1">
                                            <button onClick={()=>setDetail(s)} title="View Details"
                                                    className="p-1.5 rounded-lg hover:bg-surface-100 text-surface-500 hover:text-brand-600 transition-colors"><Icon.Eye/></button>
                                            {s.status==='completed' && s.document_path && (
                                                <a href={`${API}/api/download/${s.id}`} title="Download"
                                                   className="p-1.5 rounded-lg hover:bg-surface-100 text-surface-500 hover:text-emerald-600 transition-colors"><Icon.Download/></a>
                                            )}
                                            <button onClick={()=>deleteSession(s.id)} title="Delete"
                                                    className="p-1.5 rounded-lg hover:bg-red-50 text-surface-400 hover:text-red-500 transition-colors"><Icon.Trash/></button>
                                        </div>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>

                {/* Pagination */}
                {totalPages>1 && (
                    <div className="flex items-center justify-between px-4 py-3 border-t border-surface-100 text-xs text-surface-500">
                        <span>Showing {page*limit+1}–{Math.min((page+1)*limit,history.total)} of {history.total}</span>
                        <div className="flex gap-1">
                            <button disabled={page===0} onClick={()=>setPage(p=>p-1)}
                                    className="p-1 rounded hover:bg-surface-100 disabled:opacity-30"><Icon.ChevronL/></button>
                            <button disabled={page>=totalPages-1} onClick={()=>setPage(p=>p+1)}
                                    className="p-1 rounded hover:bg-surface-100 disabled:opacity-30"><Icon.ChevronR/></button>
                        </div>
                    </div>
                )}
            </div>

            {/* Detail Modal */}
            {detail && (
                <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 anim-fade-in" onClick={()=>setDetail(null)}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
                        <div className="flex items-center justify-between p-5 border-b border-surface-100">
                            <div>
                                <h2 className="text-lg font-bold">{detail.title}</h2>
                                <p className="text-xs text-surface-400 mt-0.5">{detail.id} · {fmtDate(detail.created_at)}</p>
                            </div>
                            <button onClick={()=>setDetail(null)} className="p-2 rounded-lg hover:bg-surface-100"><Icon.X/></button>
                        </div>
                        <div className="p-5 space-y-5 text-sm">
                            {/* Meta */}
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                {[
                                    ['Status',detail.status],
                                    ['Language',langLabel[detail.language]||detail.language],
                                    ['Confidence',detail.confidence?(detail.confidence*100).toFixed(1)+'%':'—'],
                                    ['Words',detail.word_count||'—'],
                                    ['Audio',fmtDuration(detail.audio_duration)],
                                    ['Format',detail.document_format||'—'],
                                    ['Process Time',detail.time_total?detail.time_total+'s':'—'],
                                    ['AI Enhanced',detail.use_ai?'Yes':'No'],
                                ].map(([k,v])=>(
                                    <div key={k} className="bg-surface-50 rounded-lg p-3">
                                        <div className="text-xs text-surface-400 mb-1">{k}</div>
                                        <div className="font-semibold">{v}</div>
                                    </div>
                                ))}
                            </div>

                            {/* Transcript */}
                            {detail.transcript && (
                                <div>
                                    <h4 className="text-xs font-semibold text-surface-500 uppercase tracking-wide mb-2">Transcript</h4>
                                    <div className="bg-surface-50 rounded-lg p-4 text-surface-700 max-h-48 overflow-y-auto leading-relaxed whitespace-pre-wrap">
                                        {detail.transcript}
                                    </div>
                                </div>
                            )}

                            {/* Analysis */}
                            {detail.analysis?.executive_summary && (
                                <div>
                                    <h4 className="text-xs font-semibold text-surface-500 uppercase tracking-wide mb-2">Summary</h4>
                                    <p className="text-surface-700 leading-relaxed">{detail.analysis.executive_summary}</p>
                                </div>
                            )}
                            {detail.analysis?.concepts?.length > 0 && (
                                <div>
                                    <h4 className="text-xs font-semibold text-surface-500 uppercase tracking-wide mb-2">Key Concepts</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {detail.analysis.concepts.map((c,i)=>(
                                            <Badge key={i} color="bg-brand-50 text-brand-700">{c.term||c.name||JSON.stringify(c)}</Badge>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Error */}
                            {detail.error_message && (
                                <div className="bg-red-50 text-red-700 rounded-lg p-4 text-sm">
                                    <strong>Error:</strong> {detail.error_message}
                                </div>
                            )}

                            {/* Download button */}
                            {detail.status==='completed' && detail.document_path && (
                                <a href={`${API}/api/download/${detail.id}`}
                                   className="inline-flex items-center gap-2 px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition-colors font-medium">
                                    <Icon.Download/> Download Document
                                </a>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

/* ══════════════════ PROCESS TAB ══════════════════ */
const ProcessTab = () => {
    const recorder = useAudioRecorder();
    const [file, setFile] = useState(null);
    const [title, setTitle] = useState('EchoNotes Document');
    const [lang, setLang] = useState('en');
    const [fmt, setFmt] = useState('html');
    const [useAI, setUseAI] = useState(true);
    const [status, setStatus] = useState('idle'); // idle | uploading | processing | done | error
    const [progress, setProgress] = useState('');
    const [result, setResult] = useState(null);
    const [errMsg, setErrMsg] = useState('');
    const dropRef = useRef(null);
    const [inputMode, setInputMode] = useState('audio'); // audio | text
    const [textInput, setTextInput] = useState('');

    const handleDrop = useCallback((e) => {
        e.preventDefault();
        const f = e.dataTransfer?.files?.[0];
        if(f) setFile(f);
    },[]);

    const process = async (audioSource) => {
        setStatus('uploading'); setProgress('Uploading audio…'); setErrMsg('');
        try {
            const formData = new FormData();
            formData.append('file', audioSource);
            formData.append('title', title);
            formData.append('format', fmt);
            formData.append('use_ai', useAI);
            formData.append('language', lang);

            setProgress('Processing pipeline…');
            setStatus('processing');

            const resp = await fetch(`${API}/api/process/sync`, {method:'POST', body:formData});
            if(!resp.ok) { const e = await resp.json(); throw new Error(e.detail||'Processing failed'); }
            const data = await resp.json();
            setResult(data);
            setStatus('done');
        } catch(e) {
            setErrMsg(e.message);
            setStatus('error');
        }
    };

    const processText = async () => {
        if(!textInput.trim() || textInput.trim().split(/\s+/).length < 5) {
            setErrMsg('Please enter at least a few sentences of text.');
            setStatus('error');
            return;
        }
        setStatus('processing'); setProgress('Analyzing text…'); setErrMsg('');
        try {
            // Step 1: Analyze
            const analyzeResp = await fetch(`${API}/api/analyze`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({text: textInput.trim(), title: title})
            });
            if(!analyzeResp.ok) { const e = await analyzeResp.json(); throw new Error(e.detail||'Analysis failed'); }
            const analysis = await analyzeResp.json();

            // Step 2: Generate document
            setProgress('Generating document…');
            const genResp = await fetch(`${API}/api/generate`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({text: textInput.trim(), title: title, format: fmt, use_ai: useAI})
            });
            if(!genResp.ok) { const e = await genResp.json(); throw new Error(e.detail||'Generation failed'); }
            const genData = await genResp.json();

            setResult({
                job_id: genData.job_id,
                transcript: {
                    text: textInput.trim(),
                    confidence: 1.0,
                    duration: 0,
                    word_count: textInput.trim().split(/\s+/).length
                },
                analysis: {
                    executive_summary: analysis.executive_summary || '',
                    key_concepts: analysis.concepts ? analysis.concepts.map(c => c.term || c) : [],
                    related_topics: analysis.related_topics || []
                },
                document: {
                    job_id: genData.job_id,
                    document_path: `/api/download/${genData.job_id}`,
                    format: fmt,
                    filename: `${genData.job_id}_notes.${fmt}`
                }
            });
            setStatus('done');
        } catch(e) {
            setErrMsg(e.message);
            setStatus('error');
        }
    };

    const handleProcess = () => {
        if(inputMode === 'text') { processText(); return; }
        if(recorder.audioBlob) process(new File([recorder.audioBlob],'recording.webm',{type:'audio/webm'}));
        else if(file) process(file);
    };

    const resetAll = () => { setFile(null); setStatus('idle'); setResult(null); setErrMsg(''); setTextInput(''); recorder.reset(); };

    const hasInput = inputMode === 'text' ? textInput.trim().length > 10 : !!(recorder.audioBlob || file);

    return (
        <div className="max-w-2xl mx-auto space-y-6 anim-fade-in">
            {/* Title & Settings */}
            <div className="bg-white rounded-xl border border-surface-200 shadow-sm p-5 space-y-4">
                <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Document title…"
                       className="w-full text-lg font-semibold border-0 border-b border-surface-200 pb-2 focus:border-brand-400 outline-none"/>
                <div className="flex flex-wrap gap-4 text-sm">
                    <label className="flex items-center gap-2">
                        <Icon.Globe/> Language
                        <select value={lang} onChange={e=>setLang(e.target.value)}
                                className="rounded-lg border border-surface-200 px-2 py-1 outline-none">
                            <option value="en">English</option>
                            <option value="hi">Hindi (हिंदी)</option>
                            <option value="te">Telugu (తెలుగు)</option>
                        </select>
                    </label>
                    <label className="flex items-center gap-2">
                        <Icon.FileText/> Format
                        <select value={fmt} onChange={e=>setFmt(e.target.value)}
                                className="rounded-lg border border-surface-200 px-2 py-1 outline-none">
                            <option value="html">HTML</option>
                            <option value="md">Markdown</option>
                            <option value="pdf">PDF</option>
                            <option value="docx">Word</option>
                            <option value="txt">Plain Text</option>
                        </select>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={useAI} onChange={e=>setUseAI(e.target.checked)}
                               className="rounded border-surface-300"/>
                        <Icon.Sparkle/> AI Enhance
                    </label>
                </div>
            </div>

            {/* Input Mode Toggle */}
            {status==='idle' && (
                <div className="flex justify-center gap-2 bg-surface-100 rounded-xl p-1">
                    <button onClick={()=>setInputMode('audio')}
                            className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-medium text-sm transition-all ${inputMode==='audio'?'bg-white text-brand-600 shadow-sm':'text-surface-500 hover:text-surface-700'}`}>
                        <Icon.Mic/> Audio Input
                    </button>
                    <button onClick={()=>setInputMode('text')}
                            className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-medium text-sm transition-all ${inputMode==='text'?'bg-white text-brand-600 shadow-sm':'text-surface-500 hover:text-surface-700'}`}>
                        <Icon.FileText/> Text Input
                    </button>
                </div>
            )}

            {/* Text Input */}
            {status==='idle' && inputMode==='text' && (
                <div className="bg-white rounded-xl border border-surface-200 shadow-sm p-5 space-y-3">
                    <label className="text-sm font-medium text-surface-600">Paste or type your text</label>
                    <textarea value={textInput} onChange={e=>setTextInput(e.target.value)}
                              placeholder="Paste lecture notes, meeting transcript, article text, or any content you want to analyze and convert into structured notes…"
                              rows={10}
                              className="w-full rounded-lg border border-surface-200 p-3 text-sm focus:border-brand-400 focus:ring-1 focus:ring-brand-200 outline-none resize-y"/>
                    <div className="flex items-center justify-between text-xs text-surface-400">
                        <span>{textInput.trim() ? `${textInput.trim().split(/\s+/).length} words` : 'No text entered'}</span>
                        {textInput && <button onClick={()=>setTextInput('')} className="text-red-400 hover:text-red-500">Clear</button>}
                    </div>
                </div>
            )}

            {/* Audio Input */}
            {status==='idle' && inputMode==='audio' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* Record */}
                    <div className="bg-white rounded-xl border border-surface-200 shadow-sm p-6 flex flex-col items-center gap-4">
                        <div className={`w-16 h-16 rounded-full flex items-center justify-center transition-all ${recorder.isRecording?'bg-red-100 text-red-500':'bg-brand-50 text-brand-600'}`}>
                            <Icon.Mic/>
                        </div>
                        {recorder.isRecording ? (
                            <>
                                <div className="wave-bars text-red-400">
                                    <span/><span/><span/><span/><span/>
                                </div>
                                <span className="mono text-surface-500">{fmtDuration(recorder.duration)}</span>
                                <button onClick={recorder.stop}
                                        className="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 font-medium">
                                    Stop Recording
                                </button>
                            </>
                        ) : (
                            <>
                                {recorder.audioBlob ? (
                                    <div className="text-center space-y-2">
                                        <Badge color="bg-emerald-100 text-emerald-700">Recording ready</Badge>
                                        <p className="text-xs text-surface-400 mono">{fmtDuration(recorder.duration)}</p>
                                        <button onClick={recorder.reset} className="text-xs text-red-500 hover:underline">Discard</button>
                                    </div>
                                ) : (
                                    <button onClick={recorder.start}
                                            className="px-6 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-medium">
                                        Start Recording
                                    </button>
                                )}
                            </>
                        )}
                    </div>

                    {/* Upload */}
                    <div ref={dropRef}
                         onDragOver={e=>e.preventDefault()} onDrop={handleDrop}
                         onClick={()=>document.getElementById('audio-upload').click()}
                         className="bg-white rounded-xl border-2 border-dashed border-surface-200 hover:border-brand-400 shadow-sm p-6 flex flex-col items-center gap-4 cursor-pointer transition-colors">
                        <div className="w-16 h-16 rounded-full bg-surface-100 text-surface-500 flex items-center justify-center">
                            <Icon.Upload/>
                        </div>
                        {file ? (
                            <div className="text-center space-y-1">
                                <p className="font-medium text-sm truncate max-w-[180px]">{file.name}</p>
                                <p className="text-xs text-surface-400 mono">{(file.size/1024/1024).toFixed(1)} MB</p>
                                <button onClick={e=>{e.stopPropagation();setFile(null);}} className="text-xs text-red-500 hover:underline">Remove</button>
                            </div>
                        ) : (
                            <p className="text-sm text-surface-500">Drop audio file or click to browse</p>
                        )}
                        <input id="audio-upload" type="file" accept=".wav,.mp3,.ogg,.flac,.webm,.m4a" hidden
                               onChange={e=>setFile(e.target.files[0])}/>
                    </div>
                </div>
            )}

            {/* Process Button */}
            {status==='idle' && hasInput && (
                <button onClick={handleProcess}
                        className="w-full py-3 bg-brand-600 text-white rounded-xl hover:bg-brand-700 font-semibold text-lg shadow-md shadow-brand-200 transition-all">
                    {inputMode==='text' ? 'Analyze & Generate Notes' : 'Process Audio'}
                </button>
            )}

            {/* Processing State */}
            {(status==='uploading'||status==='processing') && (
                <div className="bg-white rounded-xl border border-surface-200 shadow-sm p-8 flex flex-col items-center gap-4 anim-fade-up">
                    <Icon.Loader className="w-10 h-10 text-brand-500"/>
                    <p className="text-lg font-semibold">{progress}</p>
                    <p className="text-sm text-surface-400">This may take a moment…</p>
                </div>
            )}

            {/* Error */}
            {status==='error' && (
                <div className="bg-red-50 border border-red-200 rounded-xl p-6 text-center space-y-3 anim-fade-up">
                    <p className="text-red-600 font-semibold">{errMsg}</p>
                    <button onClick={resetAll} className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 font-medium">Try Again</button>
                </div>
            )}

            {/* Done */}
            {status==='done' && result && (
                <div className="bg-white rounded-xl border border-surface-200 shadow-sm p-6 space-y-5 anim-fade-up">
                    <div className="flex items-center gap-3 text-emerald-600">
                        <div className="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center"><Icon.Check/></div>
                        <div>
                            <p className="font-bold text-lg">Processing Complete</p>
                            <p className="text-sm text-surface-500">{result.transcript?.word_count} words · {(result.transcript?.confidence*100).toFixed(1)}% confidence</p>
                        </div>
                    </div>

                    {result.transcript?.text && (
                        <div className="bg-surface-50 rounded-lg p-4 max-h-40 overflow-y-auto text-sm text-surface-700 whitespace-pre-wrap">
                            {result.transcript.text}
                        </div>
                    )}

                    <div className="flex gap-3">
                        <a href={`${API}${result.document?.document_path}`}
                           className="flex-1 flex items-center justify-center gap-2 py-2.5 bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-medium">
                            <Icon.Download/> Download {result.document?.format?.toUpperCase()}
                        </a>
                        <button onClick={resetAll}
                                className="px-5 py-2.5 border border-surface-200 rounded-lg hover:bg-surface-50 font-medium">
                            New Session
                        </button>
                    </div>
                </div>
            )}
        </div>
    );
};

/* ══════════════════ APP SHELL ══════════════════ */
const App = () => {
    const [tab, setTab] = useState('process'); // process | dashboard

    return (
        <div className="min-h-screen">
            {/* Header */}
            <header className="bg-white border-b border-surface-200 sticky top-0 z-30">
                <div className="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
                    <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-sm">E</div>
                        <span className="font-bold text-lg tracking-tight">EchoNotes</span>
                    </div>
                    <nav className="flex gap-1 bg-surface-100 rounded-lg p-0.5">
                        {[
                            {id:'process', label:'Process', icon:<Icon.Mic/>},
                            {id:'dashboard', label:'Dashboard', icon:<Icon.BarChart/>},
                        ].map(t=>(
                            <button key={t.id} onClick={()=>setTab(t.id)}
                                    className={`flex items-center gap-1.5 px-4 py-1.5 rounded-md text-sm font-medium transition-all ${tab===t.id?'bg-white text-brand-700 shadow-sm':'text-surface-500 hover:text-surface-700'}`}>
                                {t.icon} {t.label}
                            </button>
                        ))}
                    </nav>
                </div>
            </header>

            {/* Content */}
            <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6">
                {tab==='process'   && <ProcessTab/>}
                {tab==='dashboard' && <DashboardTab/>}
            </main>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
